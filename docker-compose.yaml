services:
  clinic-2026-glaciers:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/project
      - ${DATA_DIR}:/data
    
    environment:
      DATA_DIR: /data
    
    shm_size: '16gb'
    # At least one of stdin_open or tty is required to make devcontainer work
    stdin_open: true
    tty: true

  # Label Studio, for hand-labeling the images. See labelstudio/README.md.
  # Start it with `make labelstudio`, not `docker compose up`, so that the project and its
  # tasks get configured too.
  labelstudio:
    image: heartexlabs/label-studio:1.23.0
    ports:
      - "8080:8080"
    volumes:
      # Annotations live in this named volume. `docker compose down -v` deletes them.
      - labelstudio-state:/label-studio/data
    environment:
      LABEL_STUDIO_USERNAME: ${LABELSTUDIO_USERNAME:-student@uchicago.edu}
      LABEL_STUDIO_PASSWORD: ${LABELSTUDIO_PASSWORD:-glaciers2026}
      # Presets the API token so labelstudio/setup.sh can configure the project on a cold
      # start without anyone copying a token out of the web UI.
      LABEL_STUDIO_USER_TOKEN: ${LABELSTUDIO_TOKEN:-clinic2026glaciersdevtoken}
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"

  # Renders the HDF5 frames in DATA_DIR as PNG tiles on request, so Label Studio can show them
  # without a second copy of the data. See labelstudio/tileserver/tileserver.py.
  tileserver:
    build: labelstudio/tileserver
    ports:
      - "8081:8081"
    volumes:
      # The data, read-only: labeling never needs to write to shared data.
      - ${DATA_DIR}:/data:ro
      # A few KB per frame: its display range and which tiles have data.
      - tileserver-cache:/cache
    environment:
      IMAGE_DIR: /data/${LABELSTUDIO_IMAGE_SUBDIR:-images}
      TILE_SIZE: ${TILESERVER_TILE_SIZE:-4096}

volumes:
  labelstudio-state:
  tileserver-cache:
